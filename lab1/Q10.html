<!DOCTYPE html>
<html>
<head>
    <title>Ordered Lists</title>
</head>
<body>
    <h1>Ordered Lists</h1>

    <h2>Roman Numerals</h2>
    <ol type="I">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

    <h2>Lowercase Letters</h2>
    <ol type="a">
        <li>Python</li>
        <li>Java</li>
        <li>C++</li>
    </ol>
</body>
</html>
